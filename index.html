<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>二年級上學期國文科第二次段考｜注音國字錯題診斷與60題隨堂特訓</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .serif-title {
      font-family: 'Noto Serif TC', serif;
    }
    .card-shadow {
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
    }
    .option-btn {
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .option-btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    /* 隱藏橫向捲軸但保持可滑動 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 頂部導覽與統計儀表板 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 sm:py-4">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-800">
              二年級上學期｜第二次段考
            </span>
            <span class="text-xs text-slate-500">範圍：第四課～第六課（含語文常識二）</span>
          </div>
          <h1 class="serif-title text-lg sm:text-2xl font-bold text-slate-900 mt-1">
            注音國字錯題診斷與 60 題互動特訓
          </h1>
        </div>

        <!-- 進度與操作按鈕 -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
          <div class="flex items-center gap-3 bg-slate-100 px-3 py-1.5 rounded-xl text-xs sm:text-sm">
            <div>
              <span class="text-slate-500">進度：</span>
              <span id="stat-progress" class="font-bold text-slate-800">0 / 60</span>
            </div>
            <div class="h-3.5 w-[1px] bg-slate-300"></div>
            <div>
              <span class="text-slate-500">答對率：</span>
              <span id="stat-accuracy" class="font-bold text-emerald-600">--%</span>
            </div>
            <div class="h-3.5 w-[1px] bg-slate-300"></div>
            <div>
              <span class="text-slate-500">錯題本：</span>
              <span id="stat-wrong" class="font-bold text-rose-600">0</span>
            </div>
          </div>

          <button id="btn-report" onclick="openReportModal()" class="px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition shadow-sm cursor-pointer">
            弱點診斷報告
          </button>
          <button onclick="openResetModal()" class="px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-600 hover:text-rose-600 hover:bg-rose-50 border border-slate-200 transition cursor-pointer" title="清除作答紀錄">

      </div>

      <nav class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto pt-3 pb-1 no-scrollbar" id="category-tabs">

      </nav>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 space-y-6">

    <!-- 篩選工具列 -->
    <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-3.5 rounded-2xl border border-slate-200 card-shadow">
      <div class="flex items-center gap-2">
        <span id="current-cat-badge" class="px-3 py-1 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700">全部衍生題庫</span>
        <span id="current-cat-count" class="text-xs sm:text-sm text-slate-500">顯示 60 題</span>
      </div>

      <div class="flex items-center gap-2">
        <button id="toggle-wrong-only" onclick="toggleWrongOnly()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs sm:text-sm font-bold border border-slate-200 text-slate-700 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 transition cursor-pointer">

    <section id="quiz-list" class="space-y-4">

  <!-- 弱點診斷報告 Modal -->
  <div id="report-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
    <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[88vh] overflow-y-auto p-6 sm:p-8 shadow-2xl animate-fade-in">
      <div class="flex items-start justify-between border-b border-slate-100 pb-4">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">LEARNING ANALYTICS</span>
          <h2 class="serif-title text-xl sm:text-2xl font-bold text-slate-900 mt-0.5">學習成效與錯題弱點診斷報告</h2>
        </div>
        <button onclick="closeReportModal()" class="p-2 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 cursor-pointer">

      </div>

      <div id="report-content" class="py-5 space-y-5">

      </div>

  <!-- 自訂重設確認 Modal (取代 window.confirm) -->

        <button onclick="closeResetModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-bold text-slate-600 hover:bg-slate-50 transition cursor-pointer">
          取消
        </button>
        <button onclick="executeReset()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-sm font-bold hover:bg-rose-700 transition cursor-pointer">

    </div>
  </div>

  <footer class="bg-white border-t border-slate-200 py-5 mt-12 text-center text-xs text-slate-400">

  </footer>

  <script>

    const CATEGORIES = [
      {

            correct: '璧（玉部，美玉）',

    const STORAGE_KEY = 'g8_chinese_exam2_quiz_v2_fixed';
    let state = {
      activeCategory: 'all', // 'all' | 'cat1' | 'cat2' | 'cat3' | 'cat4'
      wrongOnly: false,
      userAnswers: {}, // { questionId: selectedOptionIndex }
      wrongSet: []     // [questionId, ...]
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.userAnswers = parsed.userAnswers || {};
          state.wrongSet = parsed.wrongSet || [];
        }
      } catch (e) {
        console.warn('無法讀取本機儲存紀錄', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          userAnswers: state.userAnswers,
          wrongSet: state.wrongSet
        }));
      } catch (e) {
        console.warn('無法寫入本機儲存紀錄', e);
      }
    }

        `;
        return;
      }

      const optionLabels = ['A', 'B', 'C', 'D'];

      container.innerHTML = filtered.map(q => {
        const userChoice = state.userAnswers[q.id];
        const hasAnswered = userChoice !== undefined;
        const isCorrect = hasAnswered && userChoice === q.answer;
        const inWrongBook = state.wrongSet.includes(q.id);

        return `
          <article id="q-card-${q.id}" class="bg-white rounded-2xl border ${
            hasAnswered
              ? (isCorrect ? 'border-emerald-200' : 'border-rose-200')
              : 'border-slate-200'
          } p-5 sm:p-6 card-shadow transition">
            <!-- 題目標頭 -->
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="inline-flex items-center justify-center w-7 h-7 rounded-lg bg-slate-900 text-white text-xs font-bold">
                  ${q.id}
                </span>
                <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-700">
                  ${q.type}
                </span>
                <span class="text-xs text-slate-400">對應：${q.ref}</span>
              </div>

              <div class="flex items-center gap-2">
                ${inWrongBook ? `
                  <span class="px-2 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-700">
                    ★ 錯題本
                  </span>
                ` : ''}
                ${hasAnswered ? `
                  <button onclick="retryQuestion(${q.id})" class="text-xs text-slate-400 hover:text-indigo-600 underline cursor-pointer">
                    重練此題
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- 題幹 -->
            <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-relaxed mb-4">
              ${q.prompt}
            </h3>

            <!-- 四個選項 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${q.options.map((opt, idx) => {
                let btnClass = 'border-slate-200 bg-slate-50/70 hover:bg-indigo-50/60 hover:border-indigo-300 text-slate-800 cursor-pointer';
                let badgeClass = 'bg-white text-slate-600 border-slate-200';
                let statusIcon = '';

                if (hasAnswered) {
                  if (idx === q.answer) {
                    btnClass = 'border-emerald-500 bg-emerald-50 text-emerald-950 font-bold ring-1 ring-emerald-500';
                    badgeClass = 'bg-emerald-600 text-white border-emerald-600';
                    statusIcon = '<span class="text-emerald-600 font-bold text-sm shrink-0">✓ 正解</span>';
                  } else if (idx === userChoice) {
                    btnClass = 'border-rose-500 bg-rose-50 text-rose-950 font-bold';
                    badgeClass = 'bg-rose-600 text-white border-rose-600';
                    statusIcon = '<span class="text-rose-600 font-bold text-sm shrink-0">✕ 誤選</span>';
                  } else {
                    btnClass = 'border-slate-100 bg-slate-50/40 text-slate-400 opacity-70';
                  }
                }

                return `
                  <button
                    onclick="selectOption(${q.id}, ${idx})"
                    ${hasAnswered ? 'disabled' : ''}
                    class="option-btn flex items-center justify-between p-3.5 rounded-xl border text-left text-sm sm:text-base ${btnClass}"
                  >
                    <div class="flex items-center gap-3">
                      <span class="inline-flex items-center justify-center w-6 h-6 rounded-full border text-xs font-bold shrink-0 ${badgeClass}">
                        ${optionLabels[idx]}
                      </span>
                      <span>${opt}</span>
                    </div>
                    ${statusIcon}
                  </button>
                `;
              }).join('')}
            </div>

            <!-- 即時解析區 -->
            ${hasAnswered ? `
              <div class="mt-4 p-4 rounded-xl ${isCorrect ? 'bg-emerald-50/80 border border-emerald-200' : 'bg-rose-50/80 border border-rose-200'} animate-fade-in">
                <div class="flex items-center gap-2 text-sm font-bold ${isCorrect ? 'text-emerald-800' : 'text-rose-800'} mb-1">
                  <span>${isCorrect ? '🎉 答對了！' : '💡 答錯了，已自動收錄至錯題本：'}</span>
                </div>
                <p class="text-xs sm:text-sm text-slate-700 leading-relaxed">
                  ${q.explanation}
                </p>
              </div>
            ` : ''}
          </article>
        `;
      }).join('');
    }

    function updateStats() {
      const answeredIds = Object.keys(state.userAnswers).map(Number);
      const totalAnswered = answeredIds.length;
      const correctCount = answeredIds.filter(id => {
        const q = QUESTIONS.find(item => item.id === id);
        return q && state.userAnswers[id] === q.answer;
      }).length;

      document.getElementById('stat-progress').textContent = `${totalAnswered} / ${QUESTIONS.length}`;
      document.getElementById('stat-accuracy').textContent = totalAnswered === 0
        ? '--%'
        : `${Math.round((correctCount / totalAnswered) * 100)}%`;
      document.getElementById('stat-wrong').textContent = state.wrongSet.length;
      document.getElementById('btn-wrong-count').textContent = state.wrongSet.length;
    }

    // ==========================================
    // 5. 互動事件處理
    // ==========================================
    function setCategory(catId) {
      state.activeCategory = catId;
      renderTabs();
      renderDiagnosis();
      renderQuizzes();
    }

    function toggleWrongOnly() {
      state.wrongOnly = !state.wrongOnly;
      renderQuizzes();
    }

    function selectOption(questionId, optionIdx) {
      if (state.userAnswers[questionId] !== undefined) return;

      const q = QUESTIONS.find(item => item.id === questionId);
      if (!q) return;

      state.userAnswers[questionId] = optionIdx;

      if (optionIdx !== q.answer) {
        if (!state.wrongSet.includes(questionId)) {
          state.wrongSet.push(questionId);
        }
      } else {
        // 重練並答對時自動移出錯題本
        state.wrongSet = state.wrongSet.filter(id => id !== questionId);
      }

      saveState();
      updateStats();
      renderQuizzes();
    }

    function retryQuestion(questionId) {
      delete state.userAnswers[questionId];
      saveState();
      updateStats();
      renderQuizzes();
    }

    function openResetModal() {
      const modal = document.getElementById('reset-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeResetModal() {
      const modal = document.getElementById('reset-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function executeReset() {
      state.userAnswers = {};
      state.wrongSet = [];
      state.wrongOnly = false;
      saveState();
      closeResetModal();
      updateStats();
      renderQuizzes();
    }

    // ==========================================
    // 6. 弱點診斷報告
    // ==========================================
    function openReportModal() {
      const modal = document.getElementById('report-modal');
      const content = document.getElementById('report-content');

      const totalAnswered = Object.keys(state.userAnswers).length;
      const catStats = CATEGORIES.map(cat => {
        const catQs = QUESTIONS.filter(q => q.category === cat.id);
        const answered = catQs.filter(q => state.userAnswers[q.id] !== undefined);
        const correct = answered.filter(q => state.userAnswers[q.id] === q.answer);
        const rate = answered.length === 0 ? null : Math.round((correct.length / answered.length) * 100);
        return { cat, total: catQs.length, answered: answered.length, correct: correct.length, rate };
      });

      const evaluated = catStats.filter(s => s.rate !== null).sort((a, b) => a.rate - b.rate);
      const weakest = evaluated.length > 0 && evaluated[0].rate < 100 ? evaluated[0] : null;

      content.innerHTML = `
        <div class="grid grid-cols-3 gap-3 text-center">
          <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
            <div class="text-xs text-slate-500">已完成題數</div>
            <div class="text-xl font-black text-slate-900 mt-1">${totalAnswered} <span class="text-xs font-normal text-slate-400">/ 60</span></div>
          </div>
          <div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200">
            <div class="text-xs text-emerald-700">累計答對題數</div>
            <div class="text-xl font-black text-emerald-700 mt-1">${catStats.reduce((acc, s) => acc + s.correct, 0)}</div>
          </div>
          <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200">
            <div class="text-xs text-rose-700">待複習錯題</div>
            <div class="text-xl font-black text-rose-700 mt-1">${state.wrongSet.length}</div>
          </div>
        </div>

        <div class="space-y-3">
          <h3 class="font-bold text-slate-800 text-sm">四大題型掌握度分析</h3>
          ${catStats.map(s => `
            <div class="p-3.5 rounded-xl border border-slate-200 bg-white">
              <div class="flex items-center justify-between text-xs sm:text-sm mb-1.5">
                <span class="font-bold text-slate-800">${s.cat.shortTitle}</span>
                <span class="font-bold ${s.rate === null ? 'text-slate-400' : (s.rate >= 80 ? 'text-emerald-600' : 'text-rose-600')}">
                  ${s.rate === null ? '尚未作答' : `${s.rate}% (${s.correct}/${s.answered})`}
                </span>
              </div>
              <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full ${s.rate === null ? 'bg-slate-200' : (s.rate >= 80 ? 'bg-emerald-500' : 'bg-rose-500')} transition-all" style="width: ${s.rate ?? 0}%"></div>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="p-4 rounded-2xl bg-indigo-50 border border-indigo-200 text-xs sm:text-sm text-indigo-950 leading-relaxed">
          <div class="font-bold mb-1">📌 專屬複習建議：</div>
          ${totalAnswered === 0
            ? '尚未開始作答喔！建議先點開上方各分類的「錯題診斷卡」複習部首與讀音口訣，再依序完成 60 題隨堂練習。'
            : weakest
              ? `目前在「<strong>${weakest.cat.shortTitle}</strong>」的正確率為 ${weakest.rate}%，建議優先開啟「只看錯題本」反覆重練該類題型，並留意偏旁部首與聲符規律。`
              : '目前作答的題型掌握度極高！請繼續保持，並將尚未完成的題目全數練習完畢。'
          }
        </div>
      `;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeReportModal() {
      const modal = document.getElementById('report-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderTabs();
      renderDiagnosis();
      renderQuizzes();
      updateStats();
    });
  </script>
</body>
</html>
